<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses | Trainer Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-color: #1e293b;
            --accent-color: #38bdf8;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Standard Sidebar */
        nav {
            width: 260px;
            background-color: var(--sidebar-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            height: 100vh;
        }

        nav h2 { font-size: 1.2rem; margin-bottom: 2rem; color: var(--accent-color); letter-spacing: 1px; }
        .nav-link { color: var(--text-dim); text-decoration: none; padding: 0.8rem 0; display: block; font-size: 0.9rem; }
        .nav-link:hover { color: var(--accent-color); }

        /* Main Area */
        main {
            flex-grow: 1;
            padding: 3rem;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .header-flex h1 { margin: 0; font-size: 1.8rem; }
        
        /* Course Table Styling */
        .course-container {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            padding: 1.2rem;
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        td {
            padding: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        tr:hover { background: rgba(255, 255, 255, 0.01); }

        .course-info h4 { margin: 0; font-size: 1rem; color: var(--accent-color); }
        .course-info p { margin: 4px 0 0; font-size: 0.8rem; color: var(--text-dim); }

        .price-tag { font-weight: 600; color: #fff; }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            transition: 0.3s;
            display: inline-block;
        }

        .btn-view { background: rgba(56, 189, 248, 0.1); color: var(--accent-color); border: 1px solid var(--accent-color); }
        .btn-edit { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid var(--warning); }
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }

        .btn-sm:hover { opacity: 0.8; transform: translateY(-1px); }

        .add-new-btn {
            background: var(--accent-color);
            color: #0f172a;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <nav>
        <h2>CYANOPY</h2>
        <a href="/trainer-dashboard/" class="nav-link">Dashboard Overview</a>
        <a href="#" class="nav-link" style="color: var(--accent-color);">Manage Courses</a>
        <a href="/create-course/" class="nav-link">Create Course</a>
        <a href="/add-lesson/" class="nav-link">Add Lesson</a>
    </nav>

    <main>
        <div class="header-flex">
            <div>
                <h1>Your Courses</h1>
                <p style="color: var(--text-dim); margin-top: 5px;">Manage, edit, and monitor your published content.</p>
            </div>
            <a href="/create-course/" class="add-new-btn">+ New Course</a>
        </div>

        <div class="course-container">
            <table>
                <thead>
                    <tr>
                        <th>Course Details</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in courses %}
                    <tr>
                        <td>
                            <div class="course-info">
                                <h4>{{ c.title }}</h4>
                                <p>{{ c.description|truncatewords:10 }}</p>
                            </div>
                        </td>
                        <td>
                            <span class="price-tag">₹{{ c.price }}</span>
                        </td>
                        <td>
                            <div class="actions">
                                <a href="{% url 'course_detail' c.id %}" class="btn-sm btn-view">View</a>
                                <a href="{% url 'edit_course' c.id %}" class="btn-sm btn-edit">Edit</a>
                                <a href="{% url 'delete_course' c.id %}" 
                                class="btn-sm btn-delete" 
                                onclick="return confirm('Are you sure you want to delete this course?')">Delete</a>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
