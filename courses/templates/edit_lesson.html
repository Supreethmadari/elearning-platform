<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Lesson | Trainer Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-color: #1e293b;
            --accent-color: #f59e0b; /* Amber for editing */
            --input-bg: #1e293b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        nav {
            width: 260px;
            background-color: var(--sidebar-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav h2 { font-size: 1.2rem; margin-bottom: 2rem; color: var(--accent-color); letter-spacing: 1px; }
        .nav-link { color: var(--text-dim); text-decoration: none; padding: 0.8rem 0; display: block; font-size: 0.9rem; }

        main { flex-grow: 1; padding: 3rem; display: flex; flex-direction: column; align-items: center; }

        .header-area { width: 100%; max-width: 700px; margin-bottom: 2rem; }
        .header-area h1 { margin: 0; font-size: 1.8rem; }

        .content-card {
            width: 100%; max-width: 700px;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .form-row { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.75rem; color: var(--accent-color); margin-bottom: 8px; font-weight: 600; }

        input, select {
            width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white;
        }

        .submit-btn {
            width: 100%; padding: 14px; background: var(--accent-color); color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 1rem;
        }

        .file-info { font-size: 0.75rem; color: var(--text-dim); margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <nav>
        <h2>CYANOPY</h2>
        <a href="{% url 'course_detail' lesson.course.id %}" class="nav-link">← Back to Curriculum</a>
    </nav>

    <main>
        <div class="header-area">
            <h1>Edit Lesson</h1>
            <p>Modify the title, order, or files for: <strong>{{ lesson.title }}</strong></p>
        </div>

        <div class="content-card">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-row">
                    <div class="form-group">
                        <label>LESSON TITLE</label>
                        <input type="text" name="title" value="{{ lesson.title }}" required>
                    </div>
                    <div class="form-group">
                        <label>ORDER</label>
                        <input type="number" name="order" value="{{ lesson.order }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>UPDATE VIDEO (Optional)</label>
                    <input type="file" name="video">
                    <span class="file-info">Currently: {{ lesson.video.name }}</span>
                </div>

                <div class="form-group">
                    <label>UPDATE NOTES (Optional)</label>
                    <input type="file" name="notes">
                    {% if lesson.notes %}
                    <span class="file-info">Currently: {{ lesson.notes.name }}</span>
                    {% endif %}
                </div>

                <button type="submit" class="submit-btn">Update Lesson Details</button>
            </form>
        </div>
    </main>

</body>
</html>
