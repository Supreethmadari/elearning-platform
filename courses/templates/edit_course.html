<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course | Trainer Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-color: #1e293b;
            --accent-color: #f59e0b; /* Amber for editing/warning */
            --input-bg: #1e293b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        nav {
            width: 260px;
            background-color: var(--sidebar-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav h2 { font-size: 1.2rem; margin-bottom: 2rem; color: var(--accent-color); letter-spacing: 1px; }
        .nav-link { color: var(--text-dim); text-decoration: none; padding: 0.8rem 0; display: block; font-size: 0.9rem; }

        /* Main Workspace */
        main {
            flex-grow: 1;
            padding: 3rem;
            display: flex;
            justify-content: center;
        }

        .edit-container {
            width: 100%;
            max-width: 600px;
        }

        .header-section { margin-bottom: 2rem; }
        .header-section h1 { margin: 0; font-size: 1.8rem; }
        .header-section p { color: var(--text-dim); margin-top: 5px; }

        .form-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.75rem; color: var(--accent-color); margin-bottom: 8px; font-weight: 600; }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-family: inherit;
            box-sizing: border-box;
        }

        textarea { height: 120px; resize: none; }

        .save-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        .cancel-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <nav>
        <h2>CYANOPY</h2>
        <a href="/trainer-courses/" class="nav-link">← Back to Dashboard</a>
        <a href="#" class="nav-link" style="color: var(--accent-color);">Editor Mode</a>
    </nav>

    <main>
        <div class="edit-container">
            <div class="header-section">
                <h1>Edit Course</h1>
                <p>Modify the details for <strong>{{ course.title }}</strong></p>
            </div>

            <div class="form-card">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label>COURSE TITLE</label>
                        <input type="text" name="title" value="{{ course.title }}" required>
                    </div>

                    <div class="form-group">
                        <label>DESCRIPTION</label>
                        <textarea name="description" required>{{ course.description }}</textarea>
                    </div>

                    <div class="form-group">
                        <label>PRICE (₹)</label>
                        <input type="number" name="price" value="{{ course.price }}" required>
                    </div>

                    <button type="submit" class="save-btn">Update Course Details</button>
                    <a href="/" class="cancel-link">Discard Changes</a>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
